<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>네컷 부스</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">

  <!-- 0. 홈 화면 -->
  <section id="screen-home" class="screen active">
    <div class="filmstrip-deco"><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow">TOUCH TO START</div>
    <h1>네컷 사진을<br/>찍어볼까요?</h1>
    <p class="hint">틀을 고르고, 6번 찍은 사진 중<br/>가장 잘 나온 4장을 골라주세요.</p>
    <button class="btn btn-primary" id="btnStart">시작하기</button>
  </section>

  <!-- 1. 프레임 선택 -->
  <section id="screen-frame" class="screen">
    <div class="eyebrow">STEP 1</div>
    <h2>사진 틀을 골라주세요</h2>
    <p class="hint">고른 틀에 맞춰 사진이 완성돼요.</p>
    <div class="frame-grid" id="frameGrid"></div>
    <div class="spacer"></div>
    <button class="btn btn-flash btn-wide" id="btnFrameNext" disabled>다음</button>
  </section>

  <!-- 2. 촬영 -->
  <section id="screen-camera" class="screen">
    <div class="eyebrow">STEP 2</div>
    <h2>6번 촬영합니다</h2>
    <div class="camera-frame">
      <video id="video" autoplay playsinline muted></video>
      <div class="countdown-overlay" id="countdownOverlay" style="display:none;"></div>
      <div class="flash-overlay" id="flashOverlay"></div>
    </div>
    <div class="shot-counter"><b id="shotCount">0</b> / 6장 촬영</div>
    <div class="spacer"></div>
    <button class="btn btn-primary btn-wide" id="btnCameraStart">촬영 시작</button>
  </section>

  <!-- 3. 4장 선택 -->
  <section id="screen-select" class="screen">
    <div class="eyebrow">STEP 3</div>
    <h2>가장 잘 나온 4장</h2>
    <p class="hint">사진을 눌러서 4장을 골라주세요. (<span id="pickedCount">0</span>/4)</p>
    <div class="select-grid" id="selectGrid"></div>
    <div class="spacer"></div>
    <button class="btn btn-flash btn-wide" id="btnSelectNext" disabled>완성하기</button>
  </section>

  <!-- 4. 미리보기 / 인화 -->
  <section id="screen-preview" class="screen">
    <div class="eyebrow">STEP 4</div>
    <h2>이렇게 완성돼요</h2>
    <canvas id="previewCanvas"></canvas>
    <div class="spacer"></div>
    <div class="bottom-bar">
      <button class="btn btn-secondary" id="btnRetake">다시 찍기</button>
      <button class="btn btn-primary btn-wide" id="btnPrint">인화하기</button>
    </div>
  </section>

  <!-- 5. QR 다운로드 대기 -->
  <section id="screen-qr" class="screen">
    <div class="eyebrow">STEP 5</div>
    <h2>완성됐어요!</h2>
    <p class="hint">휴대폰으로 QR을 스캔해서<br/>사진을 다운로드하세요.</p>
    <div id="qrcode"></div>
    <div class="status-pill" id="qrStatus">다운로드 기다리는 중…</div>
  </section>

</div>

<canvas id="captureCanvas" class="hidden-canvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/frames.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
